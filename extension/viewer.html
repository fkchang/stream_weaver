<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamWeaver doc</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f8fa;
      color: #1f2328;
    }
    header {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .5rem 1rem;
      background: #fff;
      border-bottom: 1px solid #d1d9e0;
      flex: 0 0 auto;
    }
    header .name { font-weight: 600; }
    header .source { color: #59636e; text-decoration: none; margin-left: auto; }
    header .source:hover { text-decoration: underline; }
    #frame { flex: 1 1 auto; border: 0; width: 100%; background: #fff; }
    #status { padding: 2rem; color: #59636e; }
    #status.error { color: #82071e; white-space: pre-wrap; font-family: ui-monospace, monospace; }

    /* Local-file entry point (S2). Same page, a second way in: shown instead
       of the "Rendering…" status when there's no GitHub-supplied doc to
       render (see viewer.js's hasExtensionContext/key check for exactly when
       that is). */
    /* :not([hidden]), not a bare #drop-zone rule -- an ID selector otherwise
       outranks the browser's built-in `[hidden] { display: none }` rule, so
       `dropZone.hidden = true` in viewer.js would set the attribute but the
       element would stay visually flexed anyway. */
    #drop-zone:not([hidden]) {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #drop-zone-inner {
      max-width: 28rem;
      padding: 3rem 3.5rem;
      text-align: center;
      color: #59636e;
      border: 2px dashed #d1d9e0;
      border-radius: 12px;
    }
    #drop-zone.drag-over #drop-zone-inner {
      border-color: #0969da;
      background: #ddf4ff;
      color: #1f2328;
    }
    #drop-zone code {
      padding: .1rem .35rem;
      background: #eaeef2;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: .9em;
    }
    #drop-zone-hint { margin-top: .5rem; font-size: .85em; }
    #file-picker-btn {
      padding: 0;
      color: #0969da;
      background: none;
      border: none;
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
    #drop-zone-error {
      margin-top: 1rem;
      color: #82071e;
      white-space: pre-wrap;
      font-family: ui-monospace, monospace;
      font-size: .8125rem;
    }
  </style>
</head>
<body>
  <header>
    <span class="name" id="doc-name">StreamWeaver doc</span>
    <a class="source" id="source-link" target="_blank" rel="noopener">View source on GitHub</a>
  </header>
  <div id="status">Rendering…</div>
  <!--
    Local-file entry point (S2): a drop zone / file picker for previewing a
    .org or .rb file straight off disk, no GitHub page, no server. It feeds
    the exact same "sw:render" postMessage the GitHub-button path uses below
    -- see viewer.js's startRender()/handleFile(). Hidden by default; shown
    in place of #status when viewer.js decides there's no GitHub-supplied doc
    to render instead.
  -->
  <div id="drop-zone" hidden>
    <div id="drop-zone-inner">
      <p>Drop a StreamWeaver <code>.org</code> or <code>.rb</code> file here,<br>
         or <button type="button" id="file-picker-btn">choose a file</button>.</p>
      <p id="drop-zone-hint">Rendered entirely in this tab -- nothing is uploaded.</p>
      <div id="drop-zone-error" hidden></div>
    </div>
  </div>
  <input type="file" id="file-input" accept=".org,.rb" hidden>
  <!--
    The doc renders inside this sandboxed frame, not here. Compiling Ruby in
    the browser requires eval, which Manifest V3 forbids on a normal extension
    page; a sandboxed page is the one place it is allowed. See sandbox.html.

    The `sandbox` attribute here is a second, independent layer, not a
    duplicate of manifest.json's declarative sandbox CSP for sandbox.html.
    That CSP governs sandbox.html specifically; it says nothing about
    wherever a doc-controlled navigation (a rendered link, or script setting
    location) might send this iframe next -- self-navigation isn't gated by
    "allow-scripts allow-popups" alone, and the destination is an arbitrary
    URL, not one of the manifest's declared sandbox pages, so it would load
    with full, unsandboxed privileges inside this iframe -- still visually
    contained under the "<doc name> · View source on GitHub" header, a
    credible phishing surface reached by opening an untrusted repo's file.
    The HTML sandbox attribute applies to this iframe's browsing context
    itself, so it constrains whatever ends up loaded there, original or
    navigated-to, regardless of the CSP the destination document declares
    for itself. allow-popups-to-escape-sandbox exists for the <base
    target="_blank"> in sandbox.html's <head>: an in-doc link opens as a
    normal, unsandboxed new tab with a visible URL bar instead of navigating
    this frame in place.
  -->
  <iframe id="frame" src="sandbox.html"
          sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
  <script src="viewer.js"></script>
</body>
</html>
